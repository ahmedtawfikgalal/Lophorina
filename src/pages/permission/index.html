<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lophorina — Camera access</title>
    <link rel="stylesheet" href="./permission.css" />
  </head>
  <body>
    <main>
      <h1>Allow camera access for Lophorina</h1>
      <p>
        Lophorina recognizes hand gestures on your device. Video is never recorded, stored, or sent
        anywhere. Chrome remembers this choice for the extension, so you only need to do this once.
      </p>
      <button id="grant" type="button">Allow camera</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
